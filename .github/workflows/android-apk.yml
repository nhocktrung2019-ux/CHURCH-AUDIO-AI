name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/full-phase-integration, feature/v0.17-auto-eq-phase, feature/v0.18-audioworklet-pcm, feature/v0.19-pcm-metadata-integrity, feature/v0.20-dual-channel-foundation, feature/v0.21-multichannel-pcm-preservation, feature/v0.22-synchronous-transfer-live, feature/v0.23-channel-calibration-foundation, feature/v4-audio-system-health, feature/v1.02-intelligent-spl-mapping, feature/v1.03-room-measurement-overlay, feature/v1.11-live-spl-point-capture]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main, feature/v0.17-auto-eq-phase, feature/v0.18-audioworklet-pcm, feature/v0.19-pcm-metadata-integrity, feature/v0.20-dual-channel-foundation, feature/v0.21-multichannel-pcm-preservation, feature/v0.22-synchronous-transfer-live, feature/v4-audio-system-health, feature/v1.03-room-measurement-overlay, feature/v1.11-live-spl-point-capture, feature/v1.12-rt60-pcm-capture]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

# Avoid stacking duplicate push + pull_request runs for the same feature branch.
concurrency:
  group: android-apk-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Add microphone runtime permission
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          start = s.find('<manifest')
          pos = s.find('>', start)
          if start < 0 or pos < 0:
              raise SystemExit('AndroidManifest.xml has no manifest root element')
          additions = []
          if 'android.permission.RECORD_AUDIO' not in s:
              additions.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
          if 'android.permission.MODIFY_AUDIO_SETTINGS' not in s:
              additions.append('    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />')
          if 'android.hardware.microphone' not in s:
              additions.append('    <uses-feature android:name="android.hardware.microphone" android:required="false" />')
          if additions:
              nl = chr(10)
              s = s[:pos+1] + nl + nl.join(additions) + s[pos+1:]
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: church-audio-analyzer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
